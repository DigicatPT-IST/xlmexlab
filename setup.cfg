[metadata]
name = xlmexlab
version = attr: xlmexlab.__version__
description = Zero-shot LLM prompting for procedure extraction
author = Daniel Pereira Costa
author_email = daniel.pereira.costa@tecnico.ulisboa.pt
license = Apache License 2.0
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/TBD
project_urls =
    Documentation = TBD
    Repository = https://github.com/Pocoyo7798/xlmexlab
classifiers =
    Operating System :: OS Independent
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
[options]
package_dir =
    = src
packages = find:
python_requires = >= 3.9
zip_safe = False
include_package_data = True
install_requires =
    langchain<=0.3.25
    numpy<=2.0.0 #1.26.4
    click<=8.1.7
    pydantic<=2.12.0 #2.11.7
    importlib_resources<=6.4.0
    trieregex<=1.0.0
    pint<=0.25.3 #0.23
    quantulum3<=0.9.1
    levenshtein<=0.26.0
    scipy<=1.13.0
    beautifulsoup4<=4.12.3
    joblib<=1.4.0
    scikit-learn<=1.4.2
    langchain-community<=0.4.1
    stemming<=1.0.1
    transformers<5.9.0 #4.55.2 
    pandas<=2.2.2
    openpyxl<=3.1.5
    pillow<=11.0.0
    #llm<=0.11.0 #0.22.0 #0.11.0
    flashinfer-python
    html_table_extractor<=1.4.1

[options.entry_points]
console_scripts=
    xlmexlab-data-visual = xlmexlab.cli.data:main
    xlmexlab-prompt-template-creator = xlmexlab.cli.prompt_template_creator:main
    xlmexlab-text2actions = xlmexlab.cli.text2actions:main
    xlmexlab-eval_actions = xlmexlab.cli.eval_actions:main
    xlmexlab-text2samples = xlmexlab.cli.text2samples:main
    xlmexlab-text2molar_ratios = xlmexlab.cli.text2molar_ratio:main
    xlmexlab-eval_molar_ratio = xlmexlab.cli.eval_molar_ratio:main
    xlmexlab-paragraph_classifier = xlmexlab.cli.paragraph_classifier:main
    xlmexlab-eval_classifier = xlmexlab.cli.eval_classifier:main
    xlmexlab-table2data = xlmexlab.cli.table2data:main
    xlmexlab-eval_sample_finder = xlmexlab.cli.eval_sample_finder:main
    xlmexlab-eval_table_extractor = xlmexlab.cli.eval_table_extractor:main
    xlmexlab-eval_graphs = xlmexlab.cli.eval_graphs:main
    xlmexlab-image2data = xlmexlab.cli.image2data:main
    xlmexlab-image2datanano = xlmexlab.cli.image2datanano:main
    xlmexlab-image2datanano_correction = xlmexlab.cli.image2datanano_correction:main
    xlmexlab-image2embeddings = xlmexlab.cli.image2embeddings:main
    xlmexlab-steaming_extraction = xlmexlab.cli.extract_steaming_data:main
    xlmexlab-list2headers = xlmexlab.cli.list2headers:main
    xlmexlab-adapter2inf = xlmexlab.cli.adapter2inf:main
    xlmexlab-nano2data = xlmexlab.cli.nano2data:main
[options.packages.find]
where = src

[options.package_data]
xlmexlab =
    py.typed
    resources/template/organic_synthesis_actions_schema.json
    resources/template/organic_synthesis_actions_first_template.json
    resources/template/organic_synthesis_actions_last_template.json
    resources/model_parameters/vllm_default_params.json
    resources/example/inference/Llama-7B_inference_example.json
    resources/example/inference/Llama-70B_inference_example.json
    resources/example/inference/Mistral-7B-Instruct_inference_example.json
    resources/example/inference/Vicuna-33B_inference_example.json
    resources/parsing_parameters/synthesis_parsing_parameters.json
